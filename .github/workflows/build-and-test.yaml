name: Build and Test

on:
  push:
  pull_request:
    branches: [ master ]

env:
  MAKEFLAGS: -j8

jobs:

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build-type: [ Release ]
        features:
        - -DENABLE_NGROK=ON -DENABLE_SYSTEMD=ON
        - -DENABLE_NGROK=ON -DENABLE_WEBSOCKET=ON
        - -DENABLE_NGROK=OFF
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: >
        sudo apt install --no-install-recommends --yes
        libboost-dev
        libboost-log-dev
        libboost-program-options-dev
        libssl-dev
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: >
        vcpkg install
        boost-asio
        boost-beast
        boost-crc
        boost-date-time
        boost-log
        boost-program-options
        boost-property-tree
    - uses: actions/checkout@v6
    - name: Configure Project (Ubuntu)
      if: runner.os == 'Linux'
      env:
        CXXFLAGS: -Wall -Wextra -Werror -Wshadow
      run: >
        cmake -S ${{ github.workspace }} -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
        ${{ matrix.features }}
    - name: Configure Project (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -S ${{ github.workspace }} -B build
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
        ${{ matrix.features }}
    - name: Build Project
      run: cmake --build build --config ${{ matrix.build-type }}

    - name: Compute Artifact Suffix
      id: suffix
      shell: bash
      run: |
        suffix=$(echo "${{ matrix.features }}" \
          | sed -e 's/-D//g' -e 's/=/-/g' -e 's/ \+/_/g' -e 's/[^A-Za-z0-9._-]//g')
        echo "value=${suffix}" >> "$GITHUB_OUTPUT"

    - name: Stage Artifacts (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        mkdir -p artifact
        cp build/wg-tcp-tunnel artifact/

    - name: Stage Artifacts (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p artifact
        cp build/${{ matrix.build-type }}/wg-tcp-tunnel.exe artifact/
        if [ -f "build/${{ matrix.build-type }}/wg-tcp-tunnel-wintray.exe" ]; then
          cp build/${{ matrix.build-type }}/wg-tcp-tunnel-wintray.exe artifact/
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wg-tcp-tunnel-${{ matrix.os }}-${{ matrix.build-type }}-${{ steps.suffix.outputs.value }}
        path: artifact/
        if-no-files-found: error
        retention-days: 7
